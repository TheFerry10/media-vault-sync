[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-vault-sync"
version = "0.1.0"
description = "Verified append-only media ingestion"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.19,<2",
    "azure-storage-file-share>=12.20,<13",
]

[project.optional-dependencies]
dev = ["mypy>=1.11,<2", "pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
media-vault-sync = "media_vault_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["media_vault_sync*"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
